<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peta CCTV Bandar Lampung</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* Reset dan Penataan Dasar */
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            overflow-x: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* Container Full Screen untuk Menangkap Klik di Luar Panel */
        #videoPanelWrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7); /* Latar belakang yang lebih gelap untuk menekankan modal */
            display: none; /* Awalnya tersembunyi */
            z-index: 999; /* Di bawah tombol tutup, tapi di atas peta */
        }
        
        /* Panel video itu sendiri, diletakkan di tengah wrapper */
        #videoPanel {
            position: absolute;
            top: 20px; 
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 12px;
            width: 95%;
            max-width: 960px;
            z-index: 1000; /* Pastikan di atas wrapper */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        #videoPanel iframe {
            width: 100%;
            height: min(70vh, calc(95vw * 9 / 16));
            border: none;
            border-radius: 8px;
            display: block;
        }

        #videoPanel h3 {
            color: white;
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.2rem;
            padding-right: 30px;
        }

        #closeBtn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: #e74c3c;
            border: none;
            color: white;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 1rem;
            z-index: 1001; /* Pastikan tombol di atas semuanya */
        }

        #closeBtn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="videoPanelWrapper">
        <div id="videoPanel">
            <button id="closeBtn">Tutup</button>
            <h3 id="videoTitle"></h3>
            <iframe id="videoFrame" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Inisialisasi peta
        const map = L.map("map").setView([-5.40, 105.26], 13);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);

        // Daftar lokasi CCTV statis yang TELAH DIPERBARUI
        const cctvList = [
            { name: "Tugu Adipura", lat: -5.422321456201332, lng: 105.25823858180057, url: "https://stream.lihatcctv.com/stream/01982b1d-faf1-72f7-94e0-423ffc069e31" },
            { name: "Tugu Juang", lat: -5.40905650196051, lng: 105.25799247669252, url: "https://stream.lihatcctv.com/stream/0196eb9d-2e1a-72cb-babc-0a2c2d573152" },
            { name: "Pemkot Lampung", lat: -5.429322219165505, lng: 105.26289029911312, url: "https://stream.lihatcctv.com/stream/0196ebd3-f25d-73f0-89b1-1685140006ea" },
            { name: "Simpang 3 RA Basyid", lat: -5.3514502317224215, lng: 105.26353854595021, url: "https://stream.lihatcctv.com/stream/0196ebd8-3acb-71b3-9f6e-ba47274a9755" },
            { name: "Stasiun Tanjung Karang", lat: -5.408924592359024, lng: 105.25866093097967, url: "https://stream.lihatcctv.com/stream/0196ebdb-cd7f-7033-93a1-77ba876e961c" },
            { name: "Simpang ITERA", lat: -5.359397809748541, lng: 105.30523276042773, url: "https://stream.lihatcctv.com/stream/0196ebdf-efdd-7307-adfa-b0273b207a09" },
            { name: "PKOR Way Halim", lat: -5.378124148833187, lng: 105.27850950455019, url: "https://stream.lihatcctv.com/stream/0196ec00-56c8-72fe-914b-706dca06c154" },
            { name: "Jl. Wolter M (Gubernuran)", lat: -5.439718796445849, lng: 105.25837656858215, url: "https://stream.lihatcctv.com/stream/0196ae7b-0d1e-7197-813d-1deedb6cf843" },
            { name: "Mall Boemi Kedaton (MBK)", lat: -5.38237150577507, lng: 105.25863008300006, url: "https://stream.lihatcctv.com/stream/0196ec03-7f7e-71b5-85d6-9aba0f9a00c0" },
            { name: "Simpang Pasar Tugu", lat: -5.410006202351245, lng: 105.26772957582837, url: "https://stream.lihatcctv.com/stream/0196ec06-790d-7159-a125-d4b14ddd7d90" },
            { name: "Jl. Antasari Simpang Moro", lat: -5.4033999116170195, lng: 105.28095936113165, url: "https://stream.lihatcctv.com/stream/0196ec07-b622-7190-b55a-8e4a1cfc6453" },
            { name: "JL. Gajah Mada", lat: -5.414026696344876, lng: 105.2672573754387, url: "https://stream.lihatcctv.com/stream/0196ec08-5cdd-7182-a34d-cad58f73db51" },
            { name: "Simpang Lungsir (Masjid Al-Furqon)", lat: -5.429023652395819, lng: 105.26164229518189, url: "https://stream.lihatcctv.com/stream/0196ec09-42e7-732f-95dd-78190e7ce338" },
            { name: "Raden Intan - Pangkal Pinang", lat: -5.411633376702506, lng: 105.25834782355633, url: "https://stream.lihatcctv.com/stream/0196f291-10b1-7098-86d0-ad97610abce1" },
            { name: "Simpang Gereja HKBP", lat: -5.426029649251198, lng: 105.25892771653122, url: "https://stream.lihatcctv.com/stream/0196f293-008f-7354-b039-e3635909cf2c" },
            { name: "Simpang Tugu Bambu Jl. G. Mada (BPK Penabur)", lat: -5.4186051014701775, lng: 105.26945935306682, url: "https://stream.lihatcctv.com/stream/0196f293-ca93-72b5-8b55-239d6272cb54" },
            { name: "Jl. Jend. Sudirman - Jl. M. Yamin", lat: -5.422715597178355, lng: 105.26657059237893, url: "https://stream.lihatcctv.com/stream/0196f294-65a9-70b5-b40f-e0210ce08c15" },
            { name: "Simpang MH Thamrin - Monginsidi", lat: -5.424402196113531, lng: 105.25151654300795, url: "https://stream.lihatcctv.com/stream/0196f295-1106-7032-8285-d083018cc3c3" }
        ];

        // Ambil elemen-elemen DOM
        const videoPanelWrapper = document.getElementById("videoPanelWrapper");
        const videoTitle = document.getElementById("videoTitle");
        const videoFrame = document.getElementById("videoFrame");
        const closeBtn = document.getElementById("closeBtn");

        /**
         * Fungsi untuk menutup panel video.
         */
        function closeVideoPanel() {
            videoPanelWrapper.style.display = "none";
            videoFrame.src = ""; // Menghentikan loading/streaming
        }

        /**
         * Menampilkan panel video dengan stream CCTV
         * @param {string} name - Nama lokasi CCTV.
         * @param {string} url - URL stream video.
         */
        function showVideo(name, url) {
            videoTitle.textContent = name;
            videoFrame.src = url;
            videoPanelWrapper.style.display = "block"; // Tampilkan wrapper
            
            // Gerakkan peta ke lokasi marker (UX Improvement)
            const cctv = cctvList.find(c => c.name === name);
            if (cctv) {
                map.flyTo([cctv.lat, cctv.lng], map.getZoom(), { duration: 1.5 });
            }
        }

        // Tambahkan marker ke peta
        cctvList.forEach(cctv => {
            const marker = L.marker([cctv.lat, cctv.lng]).addTo(map)
                .bindTooltip(cctv.name); 

            // Saat marker diklik, langsung panggil fungsi showVideo
            marker.on("click", () => {
                showVideo(cctv.name, cctv.url);
            });
        });

        // Event listener untuk tombol Tutup
        closeBtn.onclick = closeVideoPanel;

        // **FITUR:** Tutup panel jika klik di luar video.
        videoPanelWrapper.onclick = (event) => {
            // Cek apakah target klik adalah elemen wrapper itu sendiri
            if (event.target === videoPanelWrapper) {
                closeVideoPanel();
            }
        };
    </script>
</body>
</html>
